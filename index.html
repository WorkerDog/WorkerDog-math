
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .message-bubble-user {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        .message-bubble-ai {
            background: rgba(51, 65, 85, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Markdown styling overrides */
        .markdown-content pre {
            background: #0f172a !important;
            border-radius: 0.75rem !important;
            margin: 0.75rem 0 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        .markdown-content code {
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
        }
        .markdown-content ul, .markdown-content ol {
            padding-left: 1.5rem;
            margin: 0.5rem 0;
        }
        .markdown-content ul { list-style-type: disc; }
        .markdown-content ol { list-style-type: decimal; }
        .markdown-content a { color: #60a5fa; text-decoration: underline; }
        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        .markdown-content th, .markdown-content td {
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem;
            text-align: left;
        }
        .markdown-content th { background: rgba(255, 255, 255, 0.05); }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
<script type="importmap">

    "react-syntax-highlighter/": "https://esm.sh/react-syntax-highlighter@^16.1.0/",
    "jszip": "https://esm.sh/jszip@^3.10.1"
  }
}
</script>

</head>
